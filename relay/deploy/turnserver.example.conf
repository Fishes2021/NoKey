# 开发部署模板，不能原样使用：替换地址、realm、证书与共享密钥。
listening-port=3478
tls-listening-port=5349
# 若公网IP直接绑定网卡，两项填写该IP并删除 external-ip；
# 云主机经一对一NAT时，两项填网卡IP，external-ip填 公网IP/网卡IP。
listening-ip=10.0.0.2
relay-ip=10.0.0.2
external-ip=203.0.113.10/10.0.0.2
realm=turn.example
fingerprint
use-auth-secret
# 与 relay 配置 turn.secret 完全一致；在部署目标生成，不提交仓库。
static-auth-secret=
cert=/etc/voicedeck/tls/turn-fullchain.pem
pkey=/etc/voicedeck/tls/turn-key.pem
no-tlsv1
no-tlsv1_1
no-cli
no-multicast-peers
# 禁用 TCP relay allocation，不禁用手机到TURN的TCP/TLS连接。
no-tcp-relay
min-port=49160
max-port=49200
user-quota=4
total-quota=16
# 单位是字节/秒，输入输出分别计算；限制不等于云账单预算告警。
max-bps=65536
bps-capacity=262144
# 不允许中继访问服务器所在内网、环回及云元数据地址。
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
