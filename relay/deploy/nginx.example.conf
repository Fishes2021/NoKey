# 放在 nginx http {} 内；替换域名与证书路径后先运行 nginx -t。
map $http_upgrade $voicedeck_connection {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    server_name relay.example;
    ssl_certificate /etc/voicedeck/tls/relay-fullchain.pem;
    ssl_certificate_key /etc/voicedeck/tls/relay-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 配对 URL 含一次性码，不记录普通访问日志。
    access_log off;
    error_log /var/log/nginx/voicedeck-error.log crit;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $voicedeck_connection;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}
